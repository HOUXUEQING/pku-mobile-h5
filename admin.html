<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eefaff" />
  <title>企康运营管理后台 · 北大医疗集团</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V8l8-4 8 4v13"/><path d="M9 21v-5h6v5"/><path d="M12 7v4M10 9h4M3 21h18"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5.8M17 14a6 6 0 0 1 4 6"/></symbol>
    <symbol id="i-dept" viewBox="0 0 24 24"><path d="M4 20V7l8-3 8 3v13"/><path d="M8 10h2M14 10h2M8 14h2M14 14h2M10 20v-3h4v3"/><path d="M3 20h18"/></symbol>
    <symbol id="i-project" viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M8 7V4h8v3"/><path d="M4 12h16"/><path d="M10 12v3h4v-3"/></symbol>
    <symbol id="i-student" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.3"/><path d="M5 21a7 7 0 0 1 14 0"/><path d="M17.5 4.5 21 6l-3.5 1.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-4 3 2 5-6"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 7-7M15 5l3 3M17 3l3 3"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m14 7 5 5-5 5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m10 17-5-5 5-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M12 8v5M9 13h6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20H4v-8L16 4l4 4L8 20"/><path d="m14 6 4 4"/></symbol>
  </svg>

  <div class="admin-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard">
        <img src="./assets/logo.png" alt="北大医疗 PKU HEALTHCARE" />
      </a>

      <nav class="nav">
        <div class="nav-group">
          <p>概览</p>
          <a class="nav-item" data-nav="dashboard" href="#dashboard"><svg class="ic"><use href="#i-grid"/></svg><span>运营工作台</span></a>
          <a class="nav-item" data-nav="fivegood" href="#fivegood"><svg class="ic"><use href="#i-heart"/></svg><span>五好生活</span></a>
        </div>
        <div class="nav-group">
          <p>内容管理</p>
          <a class="nav-item" data-nav="institutions" href="#institutions"><svg class="ic"><use href="#i-building"/></svg><span>机构管理</span></a>
          <a class="nav-item" data-nav="members" href="#members"><svg class="ic"><use href="#i-users"/></svg><span>机构成员</span></a>
          <a class="nav-item" data-nav="departments" href="#departments"><svg class="ic"><use href="#i-dept"/></svg><span>科室管理</span></a>
        </div>
        <div class="nav-group">
          <p>企康项目</p>
          <a class="nav-item" data-nav="projects" href="#projects"><svg class="ic"><use href="#i-project"/></svg><span>项目管理</span></a>
          <a class="nav-item" data-nav="students" href="#students"><svg class="ic"><use href="#i-student"/></svg><span>学员管理</span></a>
          <a class="nav-item" data-nav="checkins" href="#checkins"><svg class="ic"><use href="#i-check"/></svg><span>打卡记录</span></a>
        </div>
        <div class="nav-group">
          <p>项目工作区</p>
          <a class="nav-item" data-nav="recipes" href="#recipes"><svg class="ic"><use href="#i-check"/></svg><span>食谱配置</span></a>
          <a class="nav-item" data-nav="foods" href="#foods"><svg class="ic"><use href="#i-grid"/></svg><span>食品库</span></a>
          <a class="nav-item" data-nav="meal-templates" href="#meal-templates"><svg class="ic"><use href="#i-dept"/></svg><span>餐次模板</span></a>
          <a class="nav-item" data-nav="exercise" href="#exercise"><svg class="ic"><use href="#i-chart"/></svg><span>运动处方</span></a>
          <a class="nav-item" data-nav="psych" href="#psych"><svg class="ic"><use href="#i-heart"/></svg><span>心理评估</span></a>
          <a class="nav-item" data-nav="life-checkins" href="#life-checkins"><svg class="ic"><use href="#i-check"/></svg><span>生活打卡</span></a>
          <a class="nav-item" data-nav="tasks" href="#tasks"><svg class="ic"><use href="#i-chart"/></svg><span>任务与奖励</span></a>
        </div>
        <div class="nav-group">
          <p>公共模块</p>
          <a class="nav-item" data-nav="mall" href="#mall"><svg class="ic"><use href="#i-project"/></svg><span>商城</span></a>
          <a class="nav-item" data-nav="orders" href="#orders"><svg class="ic"><use href="#i-check"/></svg><span>订单中心</span></a>
          <a class="nav-item" data-nav="articles" href="#articles"><svg class="ic"><use href="#i-edit"/></svg><span>内容发布</span></a>
          <a class="nav-item" data-nav="surveys" href="#surveys"><svg class="ic"><use href="#i-users"/></svg><span>问卷</span></a>
          <a class="nav-item" data-nav="assessments" href="#assessments"><svg class="ic"><use href="#i-chart"/></svg><span>测评</span></a>
          <a class="nav-item" data-nav="publish" href="#publish"><svg class="ic"><use href="#i-arrow"/></svg><span>发布与投放</span></a>
        </div>
        <div class="nav-group">
          <p>健康数据</p>
          <a class="nav-item" data-nav="indicators" href="#indicators"><svg class="ic"><use href="#i-chart"/></svg><span>体成分指标</span></a>
        </div>
        <div class="nav-group">
          <p>系统管理</p>
          <a class="nav-item" data-nav="accounts" href="#accounts"><svg class="ic"><use href="#i-key"/></svg><span>账号管理</span></a>
          <a class="nav-item" data-nav="roles" href="#roles"><svg class="ic"><use href="#i-settings"/></svg><span>角色权限</span></a>
        </div>
      </nav>

      <div class="sidebar-user">
        <span class="avatar avatar-sm">李</span>
        <div><b>李明</b><small>运营督导 · 全部项目</small></div>
        <span class="online-dot" aria-label="在线"></span>
      </div>
    </aside>

    <div class="app">
      <header class="topbar">
        <div class="topbar-left">
          <div class="breadcrumb" id="breadcrumb">企康运营 / 工作台</div>
          <h1 id="topTitle">运营工作台</h1>
        </div>
        <div class="topbar-right">
          <span class="scope-pill"><svg class="ic"><use href="#i-project"/></svg>全部企康项目</span>
          <span class="date-pill"><svg class="ic"><use href="#i-calendar"/></svg>2026-10-21</span>
          <span class="top-user"><span class="avatar avatar-sm">李</span><span><b>李明</b><small>运营督导</small></span></span>
        </div>
      </header>

      <main class="view" id="viewRoot"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭"><svg class="ic"><use href="#i-close"/></svg></button>
    <div id="drawerBody"></div>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="./admin-data.js"></script>
  <script src="./admin-modules-data.js"></script>
  <script src="./admin-fivegood.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
